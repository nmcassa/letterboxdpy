name: Daily DOM Health Check

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  health-survey:
    name: Letterboxd DOM Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'

      - name: Run Core Tests
        run: |
          # We run tests specifically to catch any HTML/DOM parsing failures
          uv run --locked pytest tests -m smoke

