name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "letterboxdpy/**"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check Material for MkDocs EOL & Zensical timeline
        run: |
          python -c "
          import datetime
          eol_date = datetime.date(2027, 5, 5)
          today = datetime.date.today()
          days_left = (eol_date - today).days

          print(f'Material for MkDocs EOL status: {days_left} days remaining until May 5, 2027.')
          if days_left <= 180:
              msg = f'Material for MkDocs reaches EOL in {days_left} days (2027-05-05). Evaluate Zensical migration readiness: https://zensical.org'
              print(f'::warning title=Material for MkDocs EOL Notice::{msg}')
          "

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt

      - name: Build and verify documentation
        run: |
          mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

      - name: Deploy to GitHub Pages
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          mkdocs gh-deploy --force --clean
        env:
          NO_MKDOCS_2_WARNING: "1"
